spring:
  application:
    name: movie-booking-service

  profiles:
    active: mock   # switch to "stripe" and set payment.stripe.api-key for a real gateway

  datasource:
    url: jdbc:postgresql://localhost:5432/moviebooking
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

payment:
  stripe:
    api-key: ${STRIPE_SECRET_KEY:}

logging:
  level:
    com.mentor.moviebooking: INFO